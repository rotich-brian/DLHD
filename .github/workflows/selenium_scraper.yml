name: Selenium Scraper

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  BROWSERPROXY_PATH: /usr/local/bin/browsermob-proxy/bin/browsermob-proxy
  CHROMEDRIVER_PATH: /usr/local/bin/chromedriver
  INPUT_FILE: scripts/soccer_data.json
  OUTPUT_FILE: scripts/soccer_links.json
  CHROME_OPTIONS_PATH: /tmp/chrome_options.json
  DISPLAY: :99

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium browsermob-proxy requests backoff

      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Chrome and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip xvfb libxi6 libgconf-2-4
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | cut -d ' ' -f 3 | cut -d '.' -f 1)
          wget https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}.0.6723.58/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Install BrowserMob Proxy
        run: |
          wget https://github.com/lightbody/browsermob-proxy/releases/download/browsermob-proxy-2.1.4/browsermob-proxy-2.1.4-bin.zip
          unzip browsermob-proxy-2.1.4-bin.zip
          sudo mv browsermob-proxy-2.1.4 /usr/local/bin/browsermob-proxy
          sudo chmod -R +x /usr/local/bin/browsermob-proxy

      - name: Setup Chrome Options
        run: |
          echo '{"ChromeOptions":{"args":["--no-sandbox","--disable-dev-shm-usage","--disable-gpu","--disable-software-rasterizer","--disable-extensions"]}}' > /tmp/chrome_options.json

      - name: Clean up existing X server instances
        run: |
          sudo pkill Xvfb || true
          sleep 2

      - name: Setup and Run Script
        run: |
          mkdir -p scripts
          export PYTHONUNBUFFERED=1
          
          # Start Xvfb in the background
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3  # Wait for Xvfb to start
          
          # Verify Xvfb is running
          ps aux | grep Xvfb
          
          # Run the script
          python scripts/script.py
        env:
          DISPLAY: :99
          PYTHONPATH: ${{ env.pythonLocation }}
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
          CHROME_OPTIONS_PATH: /tmp/chrome_options.json

      - name: Upload Result
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: soccer-links-json
          path: |
            scripts/soccer_links.json
            soccer_scraper.log
